[project]
name = "guarda-roupa"
version = "0.1.0"
description = "Guarda-Roupa Inteligente — ingestão de peças via Gemini 2.5 Flash + Supabase"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

# Entrypoint único da função Python na Vercel: TODO request (qualquer path) cai
# em api.telegram:handler, que despacha por path (webhook POST /api/telegram,
# e os endpoints JSON GET /api/look e /api/search para o site).
[tool.vercel]
entrypoint = "api.telegram:handler"
