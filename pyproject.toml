[project]
name = "guarda-roupa"
version = "0.1.0"
description = "Guarda-Roupa Inteligente — ingestão de peças via Gemini 2.5 Flash + Supabase"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

# Webhook do Telegram = entrypoint da função Python na Vercel.
[tool.vercel]
entrypoint = "api.telegram:handler"
