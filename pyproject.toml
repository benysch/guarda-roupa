[project]
name = "guarda-roupa"
version = "0.1.0"
description = "Guarda-Roupa Inteligente — ingestão de peças via Gemini 2.5 Flash + Supabase"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Recorte de fundo (scripts/backfill_cutouts.py). LOCAL-ONLY: pesado (onnxruntime/scipy/
# scikit-image) e NUNCA deve entrar no bundle da Vercel — por isso fica fora de
# `dependencies`. Instalar só local: `uv pip install -e '.[cutout]'`. Rodar o backfill
# com NUMBA_DISABLE_JIT=1 (ver wardrobe/cutout.py).
cutout = ["rembg[cpu]>=2.0"]

# Entrypoint único da função Python na Vercel: TODO request (qualquer path) cai
# em api.telegram:handler, que despacha por path (webhook POST /api/telegram,
# e os endpoints JSON GET /api/look e /api/search para o site).
[tool.vercel]
entrypoint = "api.telegram:handler"

[tool.pytest.ini_options]
pythonpath = ["."]
