# CI do guarda-roupa: roda a suíte Python (pytest) e a do site (vitest)
# em todo push e pull request. Salvar como .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Testes Python
        run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes do site
        run: npm test
